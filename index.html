<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 화면 미러링 클래스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- P2P 통신을 위한 PeerJS 라이브러리 추가 (이 부분이 누락되어 에러가 발생했습니다) -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .title-font { font-family: 'Jua', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        video {
            background-color: #111;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        .btn-pop {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-pop:hover { transform: translateY(-3px) scale(1.02); }
        .btn-pop:active { transform: translateY(1px) scale(0.98); }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col text-gray-800 selection:bg-amber-200">
    
    <!-- 상단 개발자 명시 -->
    <header class="bg-amber-400 text-amber-950 py-3 shadow-sm z-10 relative">
        <div class="max-w-6xl mx-auto px-4 text-center sm:text-right">
            <span class="font-medium text-sm sm:text-base tracking-wide">
                개발자 : 가치있는 미래교육 연구소 대표 김병찬 🌟
            </span>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
        
        <!-- 에러/알림 모달 -->
        <div id="msgBox" class="hidden fixed top-20 left-1/2 transform -translate-x-1/2 bg-rose-500 text-white px-6 py-3 rounded-full shadow-lg z-50 transition-opacity font-medium">
            <span id="msgText">메시지</span>
        </div>

        <div class="max-w-4xl w-full">
            <div class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-bold text-amber-600 mb-3 title-font tracking-wide">✨ 다함께 화면 보기 ✨</h1>
                <p class="text-amber-800 font-medium">나누미의 화면과 소리를 보미들에게 실시간으로 전해드려요!</p>
            </div>

            <!-- 역할 선택 화면 -->
            <div id="roleSelection" class="glass-panel rounded-3xl p-8 max-w-md mx-auto transform transition-all">
                <h2 class="text-xl font-bold mb-6 text-center text-amber-900 title-font">어떤 역할이신가요?</h2>
                <div class="space-y-4">
                    <button onclick="selectRole('instructor')" class="btn-pop w-full py-4 bg-amber-500 hover:bg-amber-600 text-white rounded-2xl font-bold text-lg shadow-md flex items-center justify-center gap-2">
                        🎈 화면 나누미 (공유하기)
                    </button>
                    <button onclick="selectRole('trainee')" class="btn-pop w-full py-4 bg-white border-2 border-amber-400 text-amber-600 hover:bg-amber-50 rounded-2xl font-bold text-lg shadow-sm flex items-center justify-center gap-2">
                        👀 화면 보미 (시청하기)
                    </button>
                </div>
            </div>

            <!-- 강사 뷰 (나누미) -->
            <div id="instructorView" class="hidden glass-panel rounded-3xl p-6 w-full transform transition-all border-amber-200 border-2">
                <div class="flex justify-between items-center mb-6 border-b border-amber-100 pb-4">
                    <h2 class="text-2xl font-bold text-amber-700 title-font">🎈 나누미 제어판</h2>
                    <button onclick="resetApp()" class="text-sm font-medium text-amber-600 hover:text-amber-800 bg-amber-100 px-3 py-1 rounded-full btn-pop">처음으로</button>
                </div>

                <!-- 인증 섹션 -->
                <div id="authSection" class="max-w-sm mx-auto mb-8 bg-white p-6 rounded-2xl shadow-sm border border-amber-100">
                    <label class="block text-sm font-bold text-amber-800 mb-3">비밀번호를 입력해주세요 🔐</label>
                    <div class="flex gap-2">
                        <input type="password" id="authCodeInput" class="flex-1 px-4 py-3 bg-amber-50 border-none rounded-xl focus:ring-2 focus:ring-amber-400 outline-none font-medium" placeholder="인증번호">
                        <button onclick="verifyInstructor()" class="btn-pop px-6 py-3 bg-amber-500 text-white rounded-xl hover:bg-amber-600 font-bold">확인</button>
                    </div>
                    <p class="text-xs text-amber-600 mt-3 text-center">시트에 설정된 번호를 실시간으로 확인합니다.</p>
                </div>

                <!-- 공유 제어 섹션 -->
                <div id="shareControlSection" class="hidden flex flex-col items-center">
                    <div class="mb-4 flex items-center gap-4">
                        <div id="shareStatus" class="flex items-center gap-2 text-emerald-500 font-bold bg-emerald-50 px-4 py-1.5 rounded-full hidden border border-emerald-100">
                            <span class="relative flex h-3 w-3">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                            </span>
                            화면 송출 중
                        </div>
                        <span id="viewerCount" class="text-sm font-bold bg-amber-100 text-amber-700 px-4 py-1.5 rounded-full hidden">함께하는 보미: 0명</span>
                    </div>

                    <video id="instructorVideo" class="mb-6 w-full max-w-3xl aspect-video object-contain bg-black rounded-2xl shadow-lg border-4 border-white" autoplay muted playsinline></video>
                    
                    <div class="flex gap-4 w-full max-w-md">
                        <button id="startShareBtn" onclick="startScreenShare()" class="btn-pop flex-1 py-4 bg-amber-500 hover:bg-amber-600 text-white rounded-2xl font-bold shadow-md text-lg">
                            🚀 화면 공유 시작하기
                        </button>
                        <button id="stopShareBtn" onclick="stopScreenShare()" class="hidden btn-pop flex-1 py-4 bg-rose-500 hover:bg-rose-600 text-white rounded-2xl font-bold shadow-md text-lg">
                            🛑 공유 멈추기
                        </button>
                    </div>
                    <p class="text-sm font-medium text-amber-700 mt-4 text-center bg-amber-100 px-4 py-2 rounded-lg">💡 공유 시 <b>'시스템 오디오 공유'</b>를 체크하면 소리도 함께 들려요!</p>
                </div>
            </div>

            <!-- 연수자 뷰 (보미) -->
            <div id="traineeView" class="hidden glass-panel rounded-3xl p-6 w-full transform transition-all border-amber-200 border-2">
                <div class="flex justify-between items-center mb-6 border-b border-amber-100 pb-4">
                    <h2 class="text-2xl font-bold text-amber-700 title-font">👀 보미 화면</h2>
                    <button onclick="resetApp()" class="text-sm font-medium text-amber-600 hover:text-amber-800 bg-amber-100 px-3 py-1 rounded-full btn-pop">나가기</button>
                </div>

                <div id="traineeStatus" class="flex flex-col items-center justify-center py-16">
                    <div class="relative w-16 h-16 mb-4">
                        <div class="absolute inset-0 bg-amber-200 rounded-full animate-ping opacity-75"></div>
                        <div class="relative flex items-center justify-center w-full h-full bg-amber-400 text-white rounded-full text-2xl">📡</div>
                    </div>
                    <p class="text-amber-800 font-bold text-lg">나누미의 화면을 열심히 찾고 있어요...</p>
                    <p class="text-amber-600 text-sm mt-2">잠시만 기다려주세요 ☺️</p>
                </div>

                <div id="videoContainer" class="hidden relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl group border-4 border-white" ondblclick="toggleFullScreen()">
                    <video id="traineeVideo" class="w-full h-full object-contain" autoplay playsinline></video>
                    
                    <!-- 커스텀 컨트롤 바 -->
                    <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex justify-between items-center z-10">
                        <button onclick="toggleAudio()" class="btn-pop bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl backdrop-blur-md flex items-center gap-2 font-medium">
                            <span id="audioIcon">🔊</span> <span id="audioText">소리 끄기</span>
                        </button>
                        <div class="hidden sm:flex gap-2 text-white text-sm opacity-90 font-medium">
                            <span>💡 화면을 두 번 누르면 전체화면이 돼요!</span>
                        </div>
                        <button onclick="toggleFullScreen()" class="btn-pop bg-amber-500/90 hover:bg-amber-500 text-white px-5 py-2 rounded-xl backdrop-blur-md flex items-center gap-2 font-bold shadow-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                            전체화면
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- WebRTC 통신 스크립트 (서버 없이 무료 공용 PeerJS 서버 활용) -->
    <script>
        // 전역 변수
        let localStream = null;
        let myPeer = null;
        let activeCalls = {};
        let activeConns = {};
        let targetRoomId = null;
        let connectInterval = null;

        // 구글 스프레드시트 실시간 데이터 가져오기
        async function fetchAuthCodeFromSheet() {
            const sheetUrl = 'https://docs.google.com/spreadsheets/d/1gZZF84ftssX4ekiJDVOZe3m57jfmoAJg2PYTAMwLEPI/export?format=csv&gid=0';
            try {
                const response = await fetch(sheetUrl);
                if (!response.ok) throw new Error("Network response was not ok");
                const csvData = await response.text();
                const rows = csvData.split('\n');
                if(rows.length > 1) {
                    const a2Data = rows[1].split(',')[0];
                    return a2Data ? a2Data.trim().replace(/"/g, '') : null;
                }
            } catch (error) {
                console.warn("구글 시트를 읽어올 수 없습니다.", error);
                return null;
            }
        }

        // 메시지 박스 표시
        function showMsg(text, duration = 3000) {
            const box = document.getElementById('msgBox');
            document.getElementById('msgText').textContent = text;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), duration);
        }

        // UI 전환 로직
        function selectRole(role) {
            document.getElementById('roleSelection').classList.add('hidden');
            if (role === 'instructor') {
                document.getElementById('instructorView').classList.remove('hidden');
            } else {
                document.getElementById('traineeView').classList.remove('hidden');
                joinAsTrainee();
            }
        }

        function resetApp() {
            stopScreenShare();
            cleanupTrainee();
            document.getElementById('instructorView').classList.add('hidden');
            document.getElementById('traineeView').classList.add('hidden');
            document.getElementById('roleSelection').classList.remove('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('shareControlSection').classList.add('hidden');
            document.getElementById('authCodeInput').value = '';
        }

        // 강사 인증
        async function verifyInstructor() {
            const inputCode = document.getElementById('authCodeInput').value;
            if(!inputCode) return showMsg("인증번호를 입력하세요.");

            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = "확인중...";
            btn.disabled = true;

            const sheetCode = await fetchAuthCodeFromSheet();
            const validCode = sheetCode || "1234"; // 시트 오류 시 대체 코드

            if (inputCode === validCode) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('shareControlSection').classList.remove('hidden');
                showMsg("✅ 확인되었어요! 이제 화면을 나눌 수 있습니다.");
            } else {
                showMsg("❌ 비밀번호가 다릅니다. 다시 확인해주세요.");
            }
            btn.textContent = originalText;
            btn.disabled = false;
        }

        // ================= 강사 (송출자) 로직 =================
        async function startScreenShare() {
            try {
                // 화면 및 오디오 캡처 (에코 캔슬링 및 노이즈 억제 추가)
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: false
                    }
                });

                // 공유 중지 감지 (브라우저 UI를 통한 중지)
                localStream.getVideoTracks()[0].onended = () => stopScreenShare();

                const video = document.getElementById('instructorVideo');
                video.srcObject = localStream;
                // 강사 본인 PC에서의 무한 루프(하울링)를 완벽히 차단
                video.muted = true; 
                video.volume = 0;

                document.getElementById('startShareBtn').classList.add('hidden');
                document.getElementById('stopShareBtn').classList.remove('hidden');
                document.getElementById('shareStatus').classList.remove('hidden');
                document.getElementById('viewerCount').classList.remove('hidden');
                updateViewerCount();

                // 방 코드 설정
                const inputCode = document.getElementById('authCodeInput').value || "1234";
                const roomId = 'mirror-korea-' + inputCode;

                // 통신 서버 연결 (STUN 서버 추가로 딜레이 최소화)
                myPeer = new Peer(roomId, {
                    config: {
                        'iceServers': [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:global.stun.twilio.com:3478' }
                        ]
                    }
                });

                myPeer.on('open', id => {
                    console.log('강사 방이 성공적으로 생성되었습니다.');
                });

                // 연수자가 접속을 시도하면
                myPeer.on('connection', conn => {
                    conn.on('open', () => {
                        activeConns[conn.peer] = conn;
                        
                        // 강사가 연수자에게 영상 통화를 걸어 화면 스트림 전달
                        const call = myPeer.call(conn.peer, localStream);
                        activeCalls[conn.peer] = call;
                        updateViewerCount();
                        
                        conn.on('close', () => removeViewer(conn.peer));
                        call.on('close', () => removeViewer(conn.peer));
                    });
                });

                myPeer.on('error', err => {
                    console.error("Peer Error:", err);
                    if (err.type === 'unavailable-id') {
                        showMsg("⚠️ 이미 누군가 같은 번호로 나누고 있어요.");
                        stopScreenShare();
                    }
                });

            } catch (err) {
                console.error("공유 에러: ", err);
                if (typeof Peer === 'undefined') {
                    showMsg("앗! 통신 기능을 불러오지 못했어요. 인터넷을 확인해주세요.");
                } else {
                    showMsg("오류발생: 화면 공유가 취소되었거나 권한이 없습니다.");
                }
                stopScreenShare();
            }
        }

        function removeViewer(peerId) {
            if(activeConns[peerId]) delete activeConns[peerId];
            if(activeCalls[peerId]) delete activeCalls[peerId];
            updateViewerCount();
        }

        function updateViewerCount() {
            const count = Object.keys(activeCalls).length;
            document.getElementById('viewerCount').textContent = `함께하는 보미: ${count}명`;
        }

        function stopScreenShare() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('instructorVideo').srcObject = null;
            
            document.getElementById('startShareBtn').classList.remove('hidden');
            document.getElementById('stopShareBtn').classList.add('hidden');
            document.getElementById('shareStatus').classList.add('hidden');
            document.getElementById('viewerCount').classList.add('hidden');

            if (myPeer) {
                myPeer.destroy();
                myPeer = null;
            }
            activeCalls = {};
            activeConns = {};
        }

        // ================= 연수자 (수신자) 로직 =================
        async function joinAsTrainee() {
            try {
                const sheetCode = await fetchAuthCodeFromSheet();
                const code = sheetCode || "1234";
                targetRoomId = 'mirror-korea-' + code;

                // 랜덤 ID로 통신 서버 접속 (STUN 서버 추가로 빠른 연결)
                myPeer = new Peer({
                    config: {
                        'iceServers': [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:global.stun.twilio.com:3478' }
                        ]
                    }
                }); 

                myPeer.on('open', id => {
                    console.log('연수자 준비 완료');
                    tryConnectToInstructor();
                });

                // 강사가 화면을 걸어오면 수신
                myPeer.on('call', call => {
                    call.answer(); // 통화 수락
                    if(connectInterval) clearInterval(connectInterval); 
                    
                    call.on('stream', remoteStream => {
                        document.getElementById('traineeStatus').classList.add('hidden');
                        document.getElementById('videoContainer').classList.remove('hidden');
                        const video = document.getElementById('traineeVideo');
                        
                        if(video.srcObject !== remoteStream) {
                            video.srcObject = remoteStream;
                            video.play().catch(e => console.error("자동 재생 대기:", e));
                        }
                    });

                    call.on('close', () => {
                        // 강사가 공유를 중단한 경우
                        resetTraineeVideo();
                        tryConnectToInstructor(); // 다시 강사 대기 상태로 전환
                    });
                });

                myPeer.on('error', err => {
                    // 강사 방이 아직 없을 때 (setInterval을 통해 재시도됨)
                });
            } catch(err) {
                console.error("연수자 접속 에러:", err);
                showMsg("보미 화면 준비 중 문제가 생겼어요 😢");
            }
        }

        // 강사 방을 찾을 때까지 주기적으로 연결 시도
        function tryConnectToInstructor() {
            if (connectInterval) clearInterval(connectInterval);
            
            const connect = () => {
                if (!myPeer || myPeer.destroyed) return;
                // 강사에게 '나 여기있다'고 신호 보냄
                myPeer.connect(targetRoomId); 
            };
            
            connect(); // 즉시 실행
            connectInterval = setInterval(connect, 500); // 대기 시간을 0.5초로 더 단축하여 딜레이 해소
        }

        function resetTraineeVideo() {
            document.getElementById('traineeVideo').srcObject = null;
            document.getElementById('videoContainer').classList.add('hidden');
            document.getElementById('traineeStatus').classList.remove('hidden');
        }

        function cleanupTrainee() {
            if (connectInterval) clearInterval(connectInterval);
            if (myPeer) {
                myPeer.destroy();
                myPeer = null;
            }
            resetTraineeVideo();
        }

        // 연수자 오디오 토글 기능 (같은 공간에 있을 경우 하울링 방지용)
        function toggleAudio() {
            const video = document.getElementById('traineeVideo');
            video.muted = !video.muted;
            document.getElementById('audioIcon').textContent = video.muted ? '🔇' : '🔊';
            document.getElementById('audioText').textContent = video.muted ? '소리 켜기' : '소리 끄기';
        }

        // 전체 화면 토글 기능 (모바일 iOS Safari 완벽 지원 및 컨트롤 바 유지)
        function toggleFullScreen() {
            const container = document.getElementById('videoContainer');
            const video = document.getElementById('traineeVideo');
            
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    // iOS 기기를 위한 예외 처리
                    video.webkitEnterFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
        
        // 창 닫을 때 정리
        window.addEventListener('beforeunload', () => {
            stopScreenShare();
            cleanupTrainee();
        });

    </script>
</body>
</html>
