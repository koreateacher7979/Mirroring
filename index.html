<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 화면 미러링 클래스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        video {
            background-color: #1a1a1a;
            width: 100%;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex flex-col text-gray-800">
    
    <!-- 상단 개발자 명시 (요구사항 1) -->
    <header class="bg-indigo-600 text-white py-3 shadow-md z-10 relative">
        <div class="max-w-6xl mx-auto px-4 text-center sm:text-right">
            <span class="font-medium text-sm sm:text-base tracking-wide">
                개발자 : 가치있는 미래교육 연구소 대표 김병찬
            </span>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <!-- 에러/알림 모달 -->
        <div id="msgBox" class="hidden fixed top-20 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded shadow-lg z-50 transition-opacity">
            <span id="msgText">메시지</span>
        </div>

        <div class="max-w-4xl w-full">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-indigo-900 mb-2">실시간 화면 미러링</h1>
                <p class="text-gray-600">강사님의 화면과 오디오를 끊김없이 실시간으로 공유합니다.</p>
            </div>

            <!-- 역할 선택 화면 -->
            <div id="roleSelection" class="glass-panel rounded-2xl shadow-xl p-8 max-w-md mx-auto transform transition-all">
                <h2 class="text-xl font-semibold mb-6 text-center text-gray-700">역할을 선택해주세요</h2>
                <div class="space-y-4">
                    <button onclick="selectRole('instructor')" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-lg transition-colors shadow-sm">
                        👨‍🏫 강사 (화면 공유하기)
                    </button>
                    <button onclick="selectRole('trainee')" class="w-full py-4 bg-white border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 rounded-xl font-semibold text-lg transition-colors shadow-sm">
                        🧑‍💻 연수자 (화면 시청하기)
                    </button>
                </div>
            </div>

            <!-- 강사 뷰 -->
            <div id="instructorView" class="hidden glass-panel rounded-2xl shadow-xl p-6 w-full transform transition-all">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h2 class="text-2xl font-bold text-indigo-900">강사 제어판</h2>
                    <button onclick="resetApp()" class="text-sm text-gray-500 hover:text-gray-700">돌아가기</button>
                </div>

                <!-- 인증 섹션 -->
                <div id="authSection" class="max-w-sm mx-auto mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-2">강사 인증번호 (구글 시트 연동)</label>
                    <div class="flex gap-2">
                        <input type="password" id="authCodeInput" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="인증번호 입력">
                        <button onclick="verifyInstructor()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">확인</button>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">구글 스프레드시트 설정 시트의 A2 셀 값을 실시간으로 확인합니다.</p>
                </div>

                <!-- 공유 제어 섹션 -->
                <div id="shareControlSection" class="hidden flex flex-col items-center">
                    <div class="mb-4 flex items-center gap-4">
                        <div id="shareStatus" class="flex items-center gap-2 text-green-600 font-medium hidden">
                            <span class="relative flex h-3 w-3">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                            </span>
                            화면 송출 중
                        </div>
                        <span id="viewerCount" class="text-sm bg-gray-100 text-gray-700 px-3 py-1 rounded-full hidden">접속자: 0명</span>
                    </div>

                    <video id="instructorVideo" class="mb-6 w-full max-w-3xl aspect-video object-contain" autoplay muted playsinline></video>
                    
                    <div class="flex gap-4 w-full max-w-md">
                        <button id="startShareBtn" onclick="startScreenShare()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold transition-colors shadow">
                            화면 공유 시작
                        </button>
                        <button id="stopShareBtn" onclick="stopScreenShare()" class="hidden flex-1 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-semibold transition-colors shadow">
                            공유 중지
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-4 text-center">공유 시 '시스템 오디오 공유'를 체크해야 소리가 함께 전달됩니다.</p>
                </div>
            </div>

            <!-- 연수자 뷰 -->
            <div id="traineeView" class="hidden glass-panel rounded-2xl shadow-xl p-6 w-full transform transition-all">
                <div class="flex justify-between items-center mb-6 border-b pb-4">
                    <h2 class="text-2xl font-bold text-indigo-900">연수자 화면</h2>
                    <button onclick="resetApp()" class="text-sm text-gray-500 hover:text-gray-700">나가기</button>
                </div>

                <div id="traineeStatus" class="flex flex-col items-center justify-center py-12">
                    <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-gray-600 font-medium">강사님의 화면 공유를 기다리는 중입니다...</p>
                </div>

                <div id="videoContainer" class="hidden relative w-full aspect-video">
                    <video id="traineeVideo" class="w-full h-full object-contain" autoplay playsinline></video>
                    <!-- 전체화면 버튼 -->
                    <button onclick="toggleFullScreen()" class="absolute bottom-4 right-4 bg-black bg-opacity-50 text-white p-2 rounded hover:bg-opacity-75 transition-opacity">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- WebRTC 통신 스크립트 (서버 없이 무료 공용 PeerJS 서버 활용) -->
    <script>
        // 전역 변수
        let localStream = null;
        let myPeer = null;
        let activeCalls = {};
        let activeConns = {};
        let targetRoomId = null;
        let connectInterval = null;

        // 구글 스프레드시트 실시간 데이터 가져오기
        async function fetchAuthCodeFromSheet() {
            const sheetUrl = 'https://docs.google.com/spreadsheets/d/1gZZF84ftssX4ekiJDVOZe3m57jfmoAJg2PYTAMwLEPI/export?format=csv&gid=0';
            try {
                const response = await fetch(sheetUrl);
                if (!response.ok) throw new Error("Network response was not ok");
                const csvData = await response.text();
                const rows = csvData.split('\n');
                if(rows.length > 1) {
                    const a2Data = rows[1].split(',')[0];
                    return a2Data ? a2Data.trim().replace(/"/g, '') : null;
                }
            } catch (error) {
                console.warn("구글 시트를 읽어올 수 없습니다.", error);
                return null;
            }
        }

        // 메시지 박스 표시
        function showMsg(text, duration = 3000) {
            const box = document.getElementById('msgBox');
            document.getElementById('msgText').textContent = text;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), duration);
        }

        // UI 전환 로직
        function selectRole(role) {
            document.getElementById('roleSelection').classList.add('hidden');
            if (role === 'instructor') {
                document.getElementById('instructorView').classList.remove('hidden');
            } else {
                document.getElementById('traineeView').classList.remove('hidden');
                joinAsTrainee();
            }
        }

        function resetApp() {
            stopScreenShare();
            cleanupTrainee();
            document.getElementById('instructorView').classList.add('hidden');
            document.getElementById('traineeView').classList.add('hidden');
            document.getElementById('roleSelection').classList.remove('hidden');
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('shareControlSection').classList.add('hidden');
            document.getElementById('authCodeInput').value = '';
        }

        // 강사 인증
        async function verifyInstructor() {
            const inputCode = document.getElementById('authCodeInput').value;
            if(!inputCode) return showMsg("인증번호를 입력하세요.");

            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = "확인중...";
            btn.disabled = true;

            const sheetCode = await fetchAuthCodeFromSheet();
            const validCode = sheetCode || "1234"; // 시트 오류 시 대체 코드

            if (inputCode === validCode) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('shareControlSection').classList.remove('hidden');
                showMsg("인증되었습니다. 화면 공유를 시작할 수 있습니다.");
            } else {
                showMsg("인증번호가 일치하지 않습니다.");
            }
            btn.textContent = originalText;
            btn.disabled = false;
        }

        // ================= 강사 (송출자) 로직 =================
        async function startScreenShare() {
            try {
                // 화면 및 오디오 캡처
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: true
                });

                // 공유 중지 감지 (브라우저 UI를 통한 중지)
                localStream.getVideoTracks()[0].onended = () => stopScreenShare();

                const video = document.getElementById('instructorVideo');
                video.srcObject = localStream;
                video.muted = true; // 본인 오디오 하울링 방지

                document.getElementById('startShareBtn').classList.add('hidden');
                document.getElementById('stopShareBtn').classList.remove('hidden');
                document.getElementById('shareStatus').classList.remove('hidden');
                document.getElementById('viewerCount').classList.remove('hidden');
                updateViewerCount();

                // 방 코드 설정
                const inputCode = document.getElementById('authCodeInput').value || "1234";
                const roomId = 'mirror-korea-' + inputCode;

                // 통신 서버 연결
                myPeer = new Peer(roomId);

                myPeer.on('open', id => {
                    console.log('강사 방이 성공적으로 생성되었습니다.');
                });

                // 연수자가 접속을 시도하면
                myPeer.on('connection', conn => {
                    conn.on('open', () => {
                        activeConns[conn.peer] = conn;
                        
                        // 강사가 연수자에게 영상 통화를 걸어 화면 스트림 전달
                        const call = myPeer.call(conn.peer, localStream);
                        activeCalls[conn.peer] = call;
                        updateViewerCount();
                        
                        conn.on('close', () => removeViewer(conn.peer));
                        call.on('close', () => removeViewer(conn.peer));
                    });
                });

                myPeer.on('error', err => {
                    console.error("Peer Error:", err);
                    if (err.type === 'unavailable-id') {
                        showMsg("이미 동일한 인증번호로 공유가 진행 중입니다.");
                        stopScreenShare();
                    }
                });

            } catch (err) {
                console.error("공유 에러: ", err);
                showMsg("화면 공유 권한이 없거나 취소되었습니다.");
            }
        }

        function removeViewer(peerId) {
            if(activeConns[peerId]) delete activeConns[peerId];
            if(activeCalls[peerId]) delete activeCalls[peerId];
            updateViewerCount();
        }

        function updateViewerCount() {
            const count = Object.keys(activeCalls).length;
            document.getElementById('viewerCount').textContent = `접속자: ${count}명`;
        }

        function stopScreenShare() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('instructorVideo').srcObject = null;
            
            document.getElementById('startShareBtn').classList.remove('hidden');
            document.getElementById('stopShareBtn').classList.add('hidden');
            document.getElementById('shareStatus').classList.add('hidden');
            document.getElementById('viewerCount').classList.add('hidden');

            if (myPeer) {
                myPeer.destroy();
                myPeer = null;
            }
            activeCalls = {};
            activeConns = {};
        }

        // ================= 연수자 (수신자) 로직 =================
        async function joinAsTrainee() {
            const sheetCode = await fetchAuthCodeFromSheet();
            const code = sheetCode || "1234";
            targetRoomId = 'mirror-korea-' + code;

            // 랜덤 ID로 통신 서버 접속
            myPeer = new Peer(); 

            myPeer.on('open', id => {
                console.log('연수자 준비 완료');
                tryConnectToInstructor();
            });

            // 강사가 화면을 걸어오면 수신
            myPeer.on('call', call => {
                call.answer(); // 통화 수락
                if(connectInterval) clearInterval(connectInterval); 
                
                call.on('stream', remoteStream => {
                    document.getElementById('traineeStatus').classList.add('hidden');
                    document.getElementById('videoContainer').classList.remove('hidden');
                    const video = document.getElementById('traineeVideo');
                    
                    if(video.srcObject !== remoteStream) {
                        video.srcObject = remoteStream;
                        video.play().catch(e => console.error("자동 재생 대기:", e));
                    }
                });

                call.on('close', () => {
                    // 강사가 공유를 중단한 경우
                    resetTraineeVideo();
                    tryConnectToInstructor(); // 다시 강사 대기 상태로 전환
                });
            });

            myPeer.on('error', err => {
                // 강사 방이 아직 없을 때 (setInterval을 통해 재시도됨)
            });
        }

        // 강사 방을 찾을 때까지 주기적으로 연결 시도
        function tryConnectToInstructor() {
            if (connectInterval) clearInterval(connectInterval);
            
            const connect = () => {
                if (!myPeer || myPeer.destroyed) return;
                // 강사에게 '나 여기있다'고 신호 보냄
                myPeer.connect(targetRoomId); 
            };
            
            connect(); // 즉시 실행
            connectInterval = setInterval(connect, 3000); // 3초마다 재시도
        }

        function resetTraineeVideo() {
            document.getElementById('traineeVideo').srcObject = null;
            document.getElementById('videoContainer').classList.add('hidden');
            document.getElementById('traineeStatus').classList.remove('hidden');
        }

        function cleanupTrainee() {
            if (connectInterval) clearInterval(connectInterval);
            if (myPeer) {
                myPeer.destroy();
                myPeer = null;
            }
            resetTraineeVideo();
        }

        // 전체 화면 토글 기능
        function toggleFullScreen() {
            const video = document.getElementById('traineeVideo');
            if (!document.fullscreenElement) {
                if (video.requestFullscreen) video.requestFullscreen();
                else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
        
        // 창 닫을 때 정리
        window.addEventListener('beforeunload', () => {
            stopScreenShare();
            cleanupTrainee();
        });

    </script>
</body>
</html>
